apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
    def localPedro = providers.gradleProperty('pedroLocalArtifacts').orNull
    if (localPedro) {
        def pedroRoot = rootProject.file(localPedro)
        def pedroProperties = new Properties()
        new File(pedroRoot, 'gradle.properties').withInputStream { pedroProperties.load(it) }
        def localCore = new File(pedroRoot, "core/build/libs/core-${pedroProperties.getProperty('version')}.jar")
        def localRevhub = new File(pedroRoot, 'revhub/build/outputs/aar/revhub-release.aar')
        if (!localCore.isFile() || !localRevhub.isFile()) {
            throw new GradleException('Build Pedro :core:jar :revhub:assembleRelease before using -PpedroLocalArtifacts')
        }
        implementation files(localCore, localRevhub)
        logger.lifecycle("Pedro verification uses local artifacts from ${pedroRoot}")
    } else {
        implementation 'com.pedropathing:revhub:3.0.1'
    }
    testImplementation 'junit:junit:4.13.2'
}
